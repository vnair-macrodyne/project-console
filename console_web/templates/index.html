<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Console</title>
<style>
  :root{
    --brand:#1F3864; --brand-2:#2f4f8f; --ink:#1a1f2b; --muted:#6b7280;
    --line:#e5e8ef; --bg:#f5f7fb; --panel:#ffffff;
    --good:#137a4a; --good-bg:#e6f5ec; --warn:#946200; --warn-bg:#fbf1dc;
    --bad:#b02121; --bad-bg:#fbe7e7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px}
  header{background:var(--brand);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px}
  header .logo{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .co{opacity:.8;font-size:12.5px;margin-left:2px}
  header .badge{margin-left:auto;background:#ffd25e;color:#5c4300;font-weight:700;font-size:11px;
    padding:3px 9px;border-radius:20px;letter-spacing:.4px;display:none}
  /* top nav menus */
  .nav{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:2px;
    position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(20,30,60,.05)}
  .navgrp{position:relative}
  .navtop{background:none;border:0;padding:12px 15px;font-size:14px;font-weight:600;color:var(--ink);
    cursor:pointer;border-bottom:3px solid transparent}
  .navtop:hover{color:var(--brand-2)}
  .navgrp.active .navtop{border-bottom-color:var(--brand);color:var(--brand)}
  a.pmlink{margin-left:auto;text-decoration:none;color:var(--brand-2);border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;align-self:center}
  a.pmlink:hover{background:#f2f6ff;border-color:var(--brand-2)}
  .navmenu{position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);
    border-radius:0 0 10px 10px;box-shadow:0 10px 26px rgba(20,30,60,.16);min-width:250px;padding:6px;
    display:none;z-index:30}
  .navgrp.open .navmenu{display:block}
  .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:7px;
    cursor:pointer;font-size:13.5px;color:var(--ink)}
  .mi:hover{background:#f2f6ff;color:var(--brand-2)}
  .mi.sel{background:#eef3ff;color:var(--brand);font-weight:600}
  .mi .mid{font-size:11.5px;color:var(--muted);margin-top:1px;font-weight:400}
  .wrap{display:flex;gap:18px;padding:18px 22px;align-items:flex-start}
  .side{flex:0 0 280px;position:sticky;top:66px}
  .main{flex:1 1 auto;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .side .card{padding:15px 15px 17px;margin-bottom:14px}
  .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
  #projwrap .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #projwrap .head a{font-size:12px;color:var(--brand-2);cursor:pointer;text-decoration:none}
  .projbox{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:4px}
  .prow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer}
  .prow:hover{background:#f4f7ff}
  .prow input{accent-color:var(--brand);width:15px;height:15px;flex:0 0 auto}
  .prow .pid{font-weight:600}
  .prow .ship{margin-left:auto;font-size:12px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;
    cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--brand-2)}
  .chip.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .daterow{display:flex;align-items:center;gap:7px;margin-top:9px}
  .daterow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 8px;
    font-size:12.5px;font-family:inherit;color:var(--ink)}
  .daterow span{color:var(--muted)}
  .dsub{font-size:11.5px;color:var(--muted);margin-top:8px}
  .drill{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(20,30,60,.16);padding:6px;z-index:50;min-width:190px}
  .drill .dh{font-size:11px;color:var(--muted);padding:5px 9px 6px;font-weight:600}
  .drill button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 9px;
    border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
  .drill button:hover{background:#f2f6ff;color:var(--brand-2)}
  table.exec tbody td.drillable{cursor:pointer;color:var(--brand-2);text-decoration:underline;
    text-decoration-color:#c7d4ee;text-underline-offset:2px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .toolbar h2{margin:0;font-size:18px;font-weight:650}
  .toolbar .sp{flex:1}
  .exp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:13px;
    font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s;color:var(--ink)}
  .exp:hover{border-color:var(--brand-2);color:var(--brand-2)}
  .exp:disabled{opacity:.45;cursor:default}
  .exp .ic{width:15px;height:15px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .stat .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.good .v{color:var(--good)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}
  .tablecard{overflow:hidden}
  .tscroll{overflow:auto;max-height:calc(100vh - 250px)}
  table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
  thead th{position:sticky;top:0;background:var(--brand);color:#fff;font-weight:600;font-size:12.5px;
    text-align:left;padding:10px 13px;white-space:nowrap;cursor:pointer;z-index:1}
  thead th.r{text-align:right}
  thead th .arrow{opacity:.55;font-size:10px;margin-left:4px}
  tbody td{padding:9px 13px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  tbody td.r{text-align:right}
  tbody td.calc{font-style:italic}
  tbody tr:nth-child(even){background:#f8fafd}
  /* eto-reporting subtotal bands (match the deployed workbook tiers) */
  tbody tr.k-l1_sub td{background:#D6E4F0;font-weight:600;border-top:1px solid #b9d0ea}
  tbody tr.k-l2_sub td{background:#BDD7EE;font-weight:600;border-top:1px solid #a7c6e6}
  tbody tr.k-l3_sub td{background:#9DC3E6;font-weight:700;border-top:1px solid #86b2dd}
  tbody tr.k-grand  td{background:#2E75B6;color:#fff;font-weight:700}
  tbody tr.band td{font-weight:700;letter-spacing:.01em}
  /* pagination */
  .pager{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
  .pager .pg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;
    font-size:12px;cursor:pointer;color:var(--ink)}
  .pager .pg:hover:not(:disabled){border-color:var(--brand-2);color:var(--brand-2)}
  .pager .pg:disabled{opacity:.4;cursor:default}
  .pager .pginfo{font-size:12px;color:var(--muted);margin:0 4px}
  .pager select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px}
  tbody tr:hover{background:#eef3ff}
  /* Executive Dashboard — group band, traffic lights, frozen cols */
  table.exec{font-family:Helvetica,Arial,sans-serif;font-size:12px}
  table.exec thead th{font-size:11px;padding:7px 10px;text-align:center;border-right:1px solid #35528a}
  table.exec thead tr.group th{top:0;height:26px}
  table.exec thead th.grp{background:#2E75B6;border-right:2px solid #fff;font-size:11px;
    letter-spacing:.3px;text-transform:uppercase}
  table.exec thead th.grpblank{background:var(--brand);border-right:1px solid #35528a;cursor:default}
  table.exec thead th.stick{background:var(--brand);color:#fff}
  table.exec thead tr.metric th{top:26px}
  table.exec tbody td{padding:6px 10px;text-align:center;border-right:1px solid var(--line);font-size:12px}
  table.exec tbody td.l{text-align:left}
  table.exec tbody tr:nth-child(even){background:var(--panel)}
  table.exec tbody tr:nth-child(even) td.zebra{background:#F2F4F8}
  td.tl-warn,table.exec tbody tr:nth-child(even) td.tl-warn{background:#FFEB9C}
  td.tl-bad,table.exec tbody tr:nth-child(even) td.tl-bad{background:#FFC7CE}
  .stick{position:sticky;background:#fff;z-index:2}
  table.exec tbody tr:nth-child(even) .stick{background:#F2F4F8}
  thead .stick{z-index:3}
  .s0{left:0} .s1{left:46px} .s2{left:108px}
  table.exec .c-rank{min-width:46px;max-width:46px}
  table.exec .c-pid{min-width:62px;max-width:62px}
  table.exec .c-proj{min-width:210px;max-width:210px;text-align:left}
  /* word-boundary wrapping (never break inside words unless unavoidable) */
  td.wrap{white-space:normal;overflow-wrap:break-word;word-break:normal;max-width:280px;min-width:150px;
    vertical-align:middle}
  .csub{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;line-height:1.25;
    overflow-wrap:break-word;word-break:normal}
  .pill{padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
  .err{background:var(--bad-bg);color:var(--bad);border:1px solid #f2c9c9;border-radius:9px;padding:12px 14px;
    margin-bottom:14px;font-size:13px;display:none}
  #rnote{font-size:12px;color:var(--muted);margin:2px 0 14px}
  .foot{color:var(--muted);font-size:11.5px;margin-top:10px;text-align:right}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.15);
    border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">PC</div>
  <h1 id="product">Project Console</h1>
  <span class="co" id="company"></span>
  <span class="badge" id="envBadge" style="display:none;background:#8a5a00">STAGING</span>
  <span class="badge" id="demoBadge">DEMO DATA</span>
  <span class="who" id="who" style="margin-left:auto;color:#c7d4ee;font-size:13px"></span>
</header>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="side">
    <div class="card">
      <div id="projwrap">
        <div class="head">
          <p class="label" style="margin:0" id="projLabel">Projects</p>
          <a id="toggleAll">select all</a>
        </div>
        <div class="projbox" id="projbox"></div>
      </div>
    </div>
    <div class="card">
      <p class="label">Date range</p>
      <div class="chips" id="chips"></div>
      <div class="daterow" id="daterow" style="display:none">
        <input type="date" id="dfrom" aria-label="from">
        <span>→</span>
        <input type="date" id="dto" aria-label="to">
      </div>
      <div class="dsub" id="dsub"></div>
    </div>
  </div>

  <div class="main">
    <div class="err" id="err"></div>
    <div class="toolbar">
      <h2 id="rtitle">Project Console</h2>
      <div class="sp"></div>
      <button class="exp" id="expx" disabled>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13l3 3m0-3l-3 3" stroke-linecap="round"/></svg>
        Excel
      </button>
      <button class="exp" id="expp" disabled>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 17v-4h1.5a1.5 1.5 0 0 1 0 3H9" stroke-linecap="round"/></svg>
        PDF
      </button>
    </div>
    <div id="rnote"></div>
    <div class="cards" id="cards"></div>
    <div class="card tablecard">
      <div class="tscroll" id="tscroll">
        <div class="empty"><div class="big">Loading…</div></div>
      </div>
    </div>
    <div class="pager" id="pager" style="display:none"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
const state = { queries:[], projects:[], selQuery:null, selProjects:new Set(),
               result:null, sort:{key:null,dir:1}, cfg:{}, datePreset:'start',
               page:1, pageSize:250, me:null };
let refreshTimer=null;

function el(id){ return document.getElementById(id); }
function j(url,opts){ return fetch(url,opts).then(r=>r.json().then(d=>({ok:r.ok,d}))); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function boot(){
  try{ state.me = await (await fetch('/api/me'+location.search)).json(); }catch(e){ state.me={}; }
  if(state.me){
    el('who').innerHTML = state.me.user
      ? `${state.me.user} · ${state.me.role||'viewer'} · <a href="/logout" style="color:#fff;text-decoration:underline">Sign out</a>`
      : '<a href="/login" style="color:#fff">Sign in</a>';
    if((state.me.environment||'prod')==='staging') el('envBadge').style.display='inline-block';
  }
  const br = await fetch('/api/branding');
  if(br.status===401){ document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif;color:#444"><h2>Not signed in</h2><p>Windows authentication was not detected. Access the console through the IIS site (or set CONSOLE_DEV_USER for local dev).</p></div>'; return; }
  const b = await br.json();
  state.cfg = b;
  el('product').textContent = b.product;
  el('company').textContent = b.company;
  el('logo').textContent = (b.product||'PC').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  if(b.color){ document.documentElement.style.setProperty('--brand', '#'+(''+b.color).replace('#','')); }
  if(b.demo) el('demoBadge').style.display = 'inline-block';
  state.lexicon = b.lexicon || {};
  if(state.lexicon.projects) el('projLabel').textContent = state.lexicon.projects;

  state.queries = await (await fetch('/api/queries')).json();
  renderNav();
  renderChips();

  state.projects = await (await fetch('/api/projects')).json();
  state.selProjects = new Set(state.projects.map(p=>p.id));   // default: all projects
  renderProjects();

  state.selQuery = state.queries[0].id;                        // default: Executive
  runQuery();
}

// ── Top nav ────────────────────────────────────────────────────────────────
function menus(){
  const order=[], byMenu={};
  state.queries.forEach(q=>{ if(!byMenu[q.menu]){ byMenu[q.menu]=[]; order.push(q.menu); } byMenu[q.menu].push(q); });
  return order.map(m=>[m, byMenu[m]]);
}
function renderNav(){
  const nav=el('nav'); nav.innerHTML='';
  menus().forEach(([m,items])=>{
    const g=document.createElement('div'); g.className='navgrp';
    const active = items.some(q=>q.id===state.selQuery);
    if(active) g.classList.add('active');
    const btn=document.createElement('button'); btn.className='navtop'; btn.textContent=m+' ▾';
    btn.onclick=(e)=>{ e.stopPropagation(); const open=g.classList.contains('open'); closeMenus(); if(!open) g.classList.add('open'); };
    g.appendChild(btn);
    const menu=document.createElement('div'); menu.className='navmenu';
    items.forEach(q=>{
      const mi=document.createElement('button'); mi.className='mi'+(q.id===state.selQuery?' sel':'');
      mi.innerHTML=`<div>${q.label}</div><div class="mid">${q.desc}</div>`;
      mi.onclick=()=>{ closeMenus(); selectReport(q.id); };
      menu.appendChild(mi);
    });
    g.appendChild(menu); nav.appendChild(g);
  });
  // role-gated links (right side): PM Budgets (pm+), Admin (admin)
  const role=(state.me&&state.me.role)||'viewer', rank={viewer:1,pm:2,admin:3};
  if((rank[role]||1)>=2){
    const pm=document.createElement('a'); pm.className='navtop pmlink'; pm.href='/pm';
    pm.textContent='PM Budgets'; pm.title='Bring a project in / edit budgets'; nav.appendChild(pm);
    const pl=document.createElement('a'); pl.className='navtop pmlink'; pl.href='/plan';
    pl.style.marginLeft='8px'; pl.textContent='Project Plan';
    pl.title='Enter schedule & progress (% done, ship date, run-outs)'; nav.appendChild(pl);
  }
  if((rank[role]||1)>=3){
    const ad=document.createElement('a'); ad.className='navtop pmlink'; ad.href='/admin';
    ad.style.marginLeft='8px'; ad.textContent='Users'; ad.title='Manage users & roles'; nav.appendChild(ad);
  }
}
function closeMenus(){ document.querySelectorAll('.navgrp.open').forEach(g=>g.classList.remove('open')); }
document.addEventListener('click', closeMenus);
function currentQuery(){ return state.queries.find(q=>q.id===state.selQuery); }
function isEtoReport(q){ return q && q.menu!=='Dashboards'; }
function selectReport(id){ state.selQuery=id; renderNav(); syncDateVisibility(); runQuery(); }

// ETO menus a board project can drill into (first report per menu; lexicon-aware)
function drillFamilies(){
  const seen={}, out=[];
  state.queries.forEach(q=>{ if(isEtoReport(q) && !seen[q.menu]){ seen[q.menu]=1; out.push([q.id,q.menu]); }});
  return out;
}

// ── Projects ─────────────────────────────────────────────────────────────────
function renderProjects(){
  const box = el('projbox'); box.innerHTML = '';
  if(!state.projects.length){ box.innerHTML = '<div style="padding:10px;color:var(--muted)">No projects.</div>'; return; }
  state.projects.forEach(p=>{
    const row = document.createElement('label'); row.className='prow';
    row.innerHTML = `<input type="checkbox" ${state.selProjects.has(p.id)?'checked':''}>
      <span class="pid">${p.label}</span><span class="ship">${p.ship||''}</span>`;
    row.querySelector('input').onchange = e=>{
      e.target.checked ? state.selProjects.add(p.id) : state.selProjects.delete(p.id);
      scheduleRefresh();
    };
    box.appendChild(row);
  });
}
el('toggleAll').onclick = ()=>{
  const all = state.selProjects.size === state.projects.length;
  state.selProjects = all ? new Set() : new Set(state.projects.map(p=>p.id));
  el('toggleAll').textContent = all ? 'select all' : 'clear all';
  renderProjects(); scheduleRefresh();
};

// ── Date presets ─────────────────────────────────────────────────────────────
const PRESETS = [['start','Start of Project to Date'],['ytd','YTD'],['pay','Pay Period'],['custom','Custom']];
function renderChips(){
  const c=el('chips'); c.innerHTML='';
  PRESETS.forEach(([k,lbl])=>{
    const b=document.createElement('div'); b.className='chip'+(state.datePreset===k?' sel':'');
    b.textContent=lbl; b.onclick=()=>setPreset(k); c.appendChild(b);
  });
}
function setPreset(k){ state.datePreset=k; renderChips();
  el('daterow').style.display = k==='custom' ? 'flex' : 'none';
  syncDateVisibility(); scheduleRefresh(); }
function syncDateVisibility(){
  const eto = isEtoReport(currentQuery());
  el('chips').parentElement.style.display = eto ? 'block' : 'none';
}
// resolve preset -> {from,to} (ISO strings or null). Uses tenant fiscal/pay-period config.
function resolveDates(){
  const p=state.datePreset;
  if(p==='custom') return { from: el('dfrom').value||null, to: el('dto').value||null };
  if(p==='start')  return { from:null, to:null };
  const today=new Date();
  if(p==='ytd'){
    const fm=(state.cfg.fiscal_year_start_month||1);
    let y=today.getFullYear(); if((today.getMonth()+1)<fm) y-=1;
    return { from: iso(new Date(y, fm-1, 1)), to: iso(today) };
  }
  if(p==='pay'){
    const days=state.cfg.pay_period_days||14;
    const anchor=state.cfg.pay_period_anchor ? new Date(state.cfg.pay_period_anchor+'T00:00:00') : new Date(today.getFullYear(),0,1);
    const per=days*86400000; let start=new Date(anchor);
    if(today>=anchor){ const n=Math.floor((today-anchor)/per); start=new Date(anchor.getTime()+n*per); }
    const end=new Date(start.getTime()+(days-1)*86400000);
    return { from: iso(start), to: iso(end) };
  }
  return { from:null, to:null };
}
function dateLabel(){
  const d=resolveDates();
  if(state.datePreset==='start') return 'Cumulative — start of project → today';
  if(!d.from && !d.to) return '';
  return (d.from||'…')+'  →  '+(d.to||'today');
}

function payload(){
  const d=resolveDates();
  return { query_id: state.selQuery, project_ids: Array.from(state.selProjects),
           date_from: d.from, date_to: d.to };
}
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(()=>{ if(state.selQuery) runQuery(); }, 450); }

async function runQuery(){
  const q=currentQuery(); if(!q) return;
  syncDateVisibility(); el('dsub').textContent = isEtoReport(q) ? dateLabel() : '';
  if(q.needs_projects && state.selProjects.size===0){
    el('tscroll').innerHTML='<div class="empty"><div class="big">Select projects</div>Pick one or more projects on the left.</div>';
    el('rtitle').textContent=q.label; el('cards').innerHTML=''; el('rnote').textContent=''; return;
  }
  hideErr();
  el('tscroll').innerHTML='<div class="empty"><div class="big"><span class="spin"></span> Running…</div></div>';
  const {ok,d} = await j('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
  if(!ok){ showErr(d.error||'Query failed'); el('tscroll').innerHTML='<div class="empty">Query failed.</div>'; return; }
  state.result=d; state.sort={key:null,dir:1}; state.page=1; renderResult();
}

// ── Rendering ────────────────────────────────────────────────────────────────
function fmt(v,type){
  if(v===null||v===undefined||v==='') return '';
  if(type==='pct') return (v*100).toFixed(1)+'%';
  if(type==='money') return '$'+Math.round(v).toLocaleString();
  if(type==='money2') return '$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  if(type==='hours') return Math.round(v).toLocaleString();
  if(type==='num') return Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
  if(type==='int') return Math.round(v).toLocaleString();
  if(type==='id') return String(v);
  return v;
}
function pctPill(v){
  if(v===null||v===undefined) return '';
  const cls = v>1.0?'bad':(v>=0.9?'warn':'good');
  return `<span class="pill ${cls}">${(v*100).toFixed(1)}%</span>`;
}
function tlClass(v,type){
  if(v===null||v===undefined) return '';
  if(type==='pct') return v>1.0?'tl-bad':(v>=0.9?'tl-warn':'');
  if(type==='days') return v>0?'tl-bad':'';
  return '';
}
function renderResult(){
  const r=state.result;
  el('rtitle').textContent=r.title; el('rnote').textContent=r.note||'';
  el('expx').disabled=false; el('expp').disabled=false;
  const cw=el('cards'); cw.innerHTML='';
  (r.cards||[]).forEach(c=>{ const d=document.createElement('div'); d.className='stat '+(c.tone||'neutral');
    d.innerHTML=`<div class="v">${c.value}</div><div class="l">${c.label}</div>`; cw.appendChild(d); });

  let rows=r.rows.slice();
  // reports with a subtotal hierarchy are shown in natural order (sorting would break it);
  // flat reports (incl. Procurement Exceptions) stay sortable, with any total row pinned last.
  const hierarchical = rows.some(r0=>['l1_sub','l2_sub','l3_sub','band'].includes(r0._kind));
  if(state.sort.key && !hierarchical){ const k=state.sort.key,dir=state.sort.dir;
    const specials=rows.filter(r0=>r0._kind && r0._kind!=='detail');
    const dets=rows.filter(r0=>!r0._kind || r0._kind==='detail');
    dets.sort((a,b)=>{ let x=a[k],y=b[k];
      if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
      if(typeof x==='number'&&typeof y==='number') return (x-y)*dir;
      return (''+x).localeCompare(''+y)*dir; });
    rows = dets.concat(specials);
  }
  state._hier = hierarchical;

  const grouped=r.columns.some(c=>c.block);
  // paginate the full set for display; exports always render every row server-side.
  const total=rows.length, pageSize=state.pageSize;
  const pages=Math.max(1, Math.ceil(total/pageSize));
  if(state.page>pages) state.page=pages;
  if(state.page<1) state.page=1;
  const start=(state.page-1)*pageSize;
  const pageRows = total>pageSize ? rows.slice(start, start+pageSize) : rows;
  if(rows.length===0){
    const dated = state.datePreset!=='start';
    el('tscroll').innerHTML='<div class="empty"><div class="big">No rows</div>Nothing matched this selection'
      +(dated?' and date range':'')+'. A project with no charged time / POs / NCRs in range will be empty here.</div>';
    renderPager(0,1,0,0);
  } else {
    el('tscroll').innerHTML = grouped ? renderExec(r,pageRows) : renderPlain(r,pageRows);
    el('tscroll').scrollTop=0;
    renderPager(total, pages, total?start+1:0, Math.min(start+pageSize,total));
  }
  if(!state._hier){
    el('tscroll').querySelectorAll('th[data-k]').forEach(th=>{
      th.onclick=()=>{ const k=th.dataset.k; if(state.sort.key===k) state.sort.dir*=-1; else {state.sort.key=k;state.sort.dir=1;} state.page=1; renderResult(); };
    });
  }
  el('tscroll').querySelectorAll('td.drillable').forEach(td=>{
    td.onclick=(e)=>{ e.stopPropagation(); openDrill(td.dataset.pid, e); };
  });
  el('foot').textContent = `${r.rows.length.toLocaleString()} row${r.rows.length===1?'':'s'} · ${r.title}`;
}
const PAGE_SIZES=[100,250,500,1000];
function renderPager(total, pages, shownFrom, shownTo){
  const p=el('pager');
  if(total<=state.pageSize){ p.style.display='none'; p.innerHTML=''; return; }
  p.style.display='flex';
  const opts=PAGE_SIZES.map(n=>`<option value="${n}"${n===state.pageSize?' selected':''}>${n}/page</option>`).join('');
  p.innerHTML =
    `<button class="pg" ${state.page<=1?'disabled':''} data-go="first">« First</button>`+
    `<button class="pg" ${state.page<=1?'disabled':''} data-go="prev">‹ Prev</button>`+
    `<span class="pginfo">Rows ${shownFrom.toLocaleString()}–${shownTo.toLocaleString()} of ${total.toLocaleString()} · page ${state.page} of ${pages}</span>`+
    `<button class="pg" ${state.page>=pages?'disabled':''} data-go="next">Next ›</button>`+
    `<button class="pg" ${state.page>=pages?'disabled':''} data-go="last">Last »</button>`+
    `<select id="psize" aria-label="rows per page">${opts}</select>`;
  p.querySelectorAll('button.pg').forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==='first') state.page=1; else if(g==='prev') state.page--; else if(g==='next') state.page++; else if(g==='last') state.page=pages;
    renderResult();
  });
  const sel=el('psize'); if(sel) sel.onchange=()=>{ state.pageSize=Number(sel.value); state.page=1; renderResult(); };
}
const _NUMT=['money','money2','num','int','hours','pct','days'];
function _isBand(r,row){
  // a pure band row: some label present, but no numeric column populated
  return r.columns.every(c=> _NUMT.indexOf(c.type)<0 || row[c.key]==null||row[c.key]==='' );
}
function renderPlain(r,rows){
  let h='<table><thead><tr>';
  r.columns.forEach(c=>{ const rc=c.align==='right'?' r':''; const arrow=(!state._hier&&state.sort.key===c.key)?(state.sort.dir>0?'▲':'▼'):'';
    h+=`<th class="${rc.trim()}" data-k="${c.key}">${c.label}<span class="arrow">${arrow}</span></th>`; });
  h+='</tr></thead><tbody>';
  rows.forEach(row=>{
    const kind=row._kind||'';
    const kc = (kind && kind!=='detail') ? ' k-'+kind : '';
    if(kind && kind!=='detail' && _isBand(r,row)){
      let label='';
      for(const c of r.columns){ if(row[c.key]!=null&&row[c.key]!==''){ label=fmt(row[c.key],c.type); break; } }
      h+=`<tr class="band${kc}"><td colspan="${r.columns.length}">${label}</td></tr>`;
      return;
    }
    h+=`<tr${kc?` class="${kc.trim()}"`:''}>`;
    r.columns.forEach(c=>{ const cls=[c.align==='right'?'r':'', c.wrap?'wrap':'', c.calc?'calc':''].filter(Boolean).join(' ');
      const cell=c.type==='pct'?pctPill(row[c.key]):fmt(row[c.key],c.type);
      h+=`<td${cls?` class="${cls}"`:''}>${cell}</td>`; });
    h+='</tr>'; });
  return h+'</tbody></table>';
}
function renderExec(r,rows){
  const cols=r.columns;
  const stickClass=i=>i===0?'stick s0 c-rank':(i===1?'stick s1 c-pid':(i===2?'stick s2 c-proj':''));
  let h='<table class="exec"><thead><tr class="group">'; let i=0;
  while(i<cols.length){ const blk=cols[i].block; let span=1;
    while(i+span<cols.length && cols[i+span].block===blk) span++;
    if(blk){ h+=`<th class="grp" colspan="${span}">${blk}</th>`; }
    else { for(let k=0;k<span;k++){ h+=`<th class="grpblank ${stickClass(i+k)}"></th>`; } }
    i+=span; }
  h+='</tr><tr class="metric">';
  cols.forEach((c,idx)=>{ const arrow=state.sort.key===c.key?(state.sort.dir>0?'▲':'▼'):'';
    h+=`<th class="${stickClass(idx)}" data-k="${c.key}">${c.label}<span class="arrow">${arrow}</span></th>`; });
  h+='</tr></thead><tbody>';
  const canDrill=drillFamilies().length>0;
  rows.forEach(row=>{ h+='<tr>';
    cols.forEach((c,idx)=>{ const v=row[c.key]; const sc=stickClass(idx);
      const drill=canDrill&&(idx===1||idx===2);
      const cls=[sc, c.align==='left'||c.type==='text'?'l':'', c.wrap?'wrap':'', c.calc?'calc':'',
                 tlClass(v,c.type), sc?'':'zebra', drill?'drillable':''].filter(Boolean).join(' ');
      const attr=drill?` data-pid="${row.ProjectID}"`:'';
      let content=fmt(v,c.type);
      if(c.key==='Project'&&row.Client) content+=`<div class="csub">${row.Client}</div>`;
      h+=`<td class="${cls}"${attr}>${content}</td>`; });
    h+='</tr>'; });
  return h+'</tbody></table>';
}

// ── Board drill-down ─────────────────────────────────────────────────────────
function openDrill(pid, ev){
  closeDrill();
  const menu=document.createElement('div'); menu.className='drill'; menu.id='drillMenu';
  menu.innerHTML=`<div class="dh">Drill into ${pid}</div>`;
  drillFamilies().forEach(([qid,fam])=>{ const btn=document.createElement('button'); btn.textContent=fam;
    btn.onclick=()=>{ closeDrill(); drillTo(pid,qid); }; menu.appendChild(btn); });
  document.body.appendChild(menu);
  const r=menu.getBoundingClientRect(); let x=ev.clientX, y=ev.clientY+8;
  if(x+r.width>window.innerWidth-8) x=window.innerWidth-r.width-8;
  if(y+r.height>window.innerHeight-8) y=ev.clientY-r.height-8;
  menu.style.left=Math.max(8,x)+'px'; menu.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click', closeDrill, {once:true}),0);
}
function closeDrill(){ const m=el('drillMenu'); if(m) m.remove(); }
function drillTo(pid, qid){ state.selProjects=new Set([Number(pid)]); renderProjects(); selectReport(qid); }

// ── Export ───────────────────────────────────────────────────────────────────
async function doExport(fmt){
  if(!state.result) return;
  const btn=fmt==='xlsx'?el('expx'):el('expp'); const txt=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> …';
  try{
    const res=await fetch('/api/export/'+fmt,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
    if(!res.ok){ const e=await res.json().catch(()=>({})); showErr(e.error||'Export failed'); return; }
    const blob=await res.blob(); const cd=res.headers.get('Content-Disposition')||'';
    const m=/filename="?([^"]+)"?/.exec(cd);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:('export.'+fmt); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  } finally { btn.disabled=false; btn.innerHTML=txt; }
}
el('expx').onclick=()=>doExport('xlsx');
el('expp').onclick=()=>doExport('pdf');

function showErr(m){ const e=el('err'); e.textContent=m; e.style.display='block'; }
function hideErr(){ el('err').style.display='none'; }

boot().catch(e=>showErr('Startup failed: '+e.message));
</script>
