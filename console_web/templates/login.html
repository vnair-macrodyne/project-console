<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — {{ product }}</title>
<style>
  :root{--brand:#1F3864;--brand-2:#2f4f8f;--ink:#1a1f2b;--muted:#6b7280;--line:#e3e7ee;--bad:#b3261e;--bad-bg:#fce8e6;}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#eef1f6,#dfe6f2)}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(20,30,60,.12);
    width:360px;padding:28px 30px}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .logo{width:38px;height:38px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .brand img.logoimg{height:48px;width:auto;border-radius:9px;display:block}
  .brand h1{font-size:17px;margin:0}
  .co{color:var(--muted);font-size:12.5px;margin:2px 0 18px}
  .env{display:inline-block;background:#8a5a00;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:12px 0 4px}
  input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14px}
  input:focus{outline:2px solid #cfe0ff;border-color:var(--brand-2)}
  button{width:100%;margin-top:18px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:var(--brand-2)}
  .err{background:var(--bad-bg);color:var(--bad);font-size:13px;padding:9px 11px;border-radius:9px;margin-top:14px}
  .hint{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
</style>
</head>
<body>
  <form class="box" method="post" action="{{ url_for('login_page') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="brand">
      {% if logo %}<img class="logoimg" src="{{ logo }}" alt="{{ company }}">{% else %}<div class="logo">{{ product[:2]|upper }}</div>{% endif %}
      <h1>{{ product }}{% if environment == 'staging' %}<span class="env">STAGING</span>{% endif %}</h1>
    </div>
    {% if not logo %}<div class="co">{{ company }}</div>{% endif %}
    <label for="u">Domain username</label>
    <input id="u" name="username" autocomplete="username" autofocus placeholder="e.g. jsmith">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">Sign in</button>
    <div class="hint">Use your Macrodyne network sign-in.</div>
  </form>
</body>
</html>
